<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreightMP Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div class="app">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <img src="../assets/logo.png" alt="FreightMP" class="brand-logo" />
          <div class="brand-text">
            <span class="brand-name">FreightMP</span>
            <span class="brand-sub">Launcher</span>
          </div>
          <button class="icon-btn" id="sidebar-toggle" title="Réduire la sidebar" aria-label="Réduire">«</button>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="account" id="account">
          <div class="avatar" id="account-avatar">?</div>
          <div class="account-text">
            <span class="account-name" id="account-name">Non connecté</span>
            <span class="account-tag" id="account-tag"></span>
          </div>
        </div>
      </aside>

      <!-- ============ MAIN ============ -->
      <main class="main">
        <header class="topbar">
          <h1 class="page-title" id="page-title">Accueil</h1>
          <div class="topbar-actions">
            <span class="clock" id="clock">--:--:--</span>
            <button class="icon-btn" id="sound-toggle" title="Sons" aria-label="Sons">🔊</button>
            <button class="icon-btn" id="theme-toggle" title="Thème" aria-label="Thème">🌙</button>
          </div>
        </header>

        <div class="content" id="content"></div>

        <footer class="statusbar">
          <span class="status" id="status">Prêt.</span>
          <span class="status-right">
            <span id="session-status"></span>
            <span class="version" id="version">v1.0.1</span>
          </span>
        </footer>
      </main>
    </div>

    <div class="toasts" id="toasts"></div>

    <!-- Palette de commandes -->
    <div class="palette" id="palette" hidden>
      <input id="palette-input" class="palette-input" placeholder="Rechercher une page ou une commande…" />
      <div class="palette-list" id="palette-list"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
