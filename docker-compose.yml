name: freightmp

services:
  postgres:
    image: postgres:16-alpine
    container_name: fmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freightmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freightmp}
      POSTGRES_DB: ${POSTGRES_DB:-freightmp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freightmp} -d ${POSTGRES_DB:-freightmp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: fmp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-freightmp}:${POSTGRES_PASSWORD:-freightmp}@postgres:5432/${POSTGRES_DB:-freightmp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-30d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change_me_internal_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_RETURN_URL: ${STEAM_RETURN_URL:-http://localhost:4000/api/v1/auth/steam/callback}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_RETURN_URL: ${DISCORD_RETURN_URL:-http://localhost:4000/api/v1/auth/discord/callback}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
    container_name: fmp-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  bot:
    build:
      context: ./discord-bot
    container_name: fmp-bot
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      API_URL: http://api:4000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change_me_internal_secret}
      ROLE_ADMIN_ID: ${ROLE_ADMIN_ID:-}
      ROLE_DEV_ID: ${ROLE_DEV_ID:-}
      ROLE_MODERATOR_ID: ${ROLE_MODERATOR_ID:-}
      ROLE_DRIVER_ID: ${ROLE_DRIVER_ID:-}
      ROLE_SYNC_INTERVAL_MINUTES: ${ROLE_SYNC_INTERVAL_MINUTES:-15}
      REGISTER_COMMANDS: ${REGISTER_COMMANDS:-true}

  mp:
    build:
      context: ./mp-server
    container_name: fmp-mp
    restart: unless-stopped
    depends_on:
      - api
    environment:
      MP_UDP_PORT: 5000
      MP_HTTP_PORT: 5001
      MP_JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      MP_REQUIRE_AUTH: ${MP_REQUIRE_AUTH:-0}
    ports:
      - "${MP_UDP_PORT:-5000}:5000/udp"
      - "${MP_HTTP_PORT:-5001}:5001"

volumes:
  fmp_pgdata:
