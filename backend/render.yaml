# Blueprint Render — API FreightMP + PostgreSQL.
#
# 1. Pousse ce dépôt sur GitHub.
# 2. Render → New → Blueprint → sélectionne le dépôt, dossier racine `backend`.
# 3. Renseigne les variables `sync: false` (Steam / Discord) dans le dashboard.
#
# URL attendue : https://freightmp-api.onrender.com
# (si tu renommes le service, mets à jour API_URL et les *_RETURN_URL).

services:
  - type: web
    name: freightmp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: freightmp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://freightmp.vercel.app
      - key: API_URL
        value: https://freightmp-api.onrender.com
      - key: CORS_ORIGINS
        value: https://freightmp.vercel.app
      - key: STEAM_RETURN_URL
        value: https://freightmp-api.onrender.com/api/v1/auth/steam/callback
      - key: DISCORD_RETURN_URL
        value: https://freightmp-api.onrender.com/api/v1/auth/discord/callback
      # À renseigner manuellement dans le dashboard Render :
      - key: STEAM_API_KEY
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

databases:
  - name: freightmp-db
    plan: free
    region: frankfurt
